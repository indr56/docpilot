# CI with an eval gate (specs/evals.md §7).
# checks:    every push and pull request - lint, types, tests, the UI build, offline evals + gate. Free.
# real-eval: by hand (Run workflow), or a push to main that changes prompts, agent, tools, retrieval,
#            chat, OCR or the evals - the real-model evals + gate. Uses the OPENAI_API_KEY secret.
# Only `push`, `pull_request` and `workflow_dispatch` triggers (never pull_request_target), so a
# fork's pull request never sees the secret.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TEST_DB_PORT: "5432"
  TEST_REDIS_URL: redis://localhost:6379
  EVAL_DB_PORT: "5432"
  EVAL_REDIS_URL: redis://localhost:6379

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      db:
        image: pgvector/pgvector:0.8.7-pg16
        env: {POSTGRES_USER: docpilot, POSTGRES_PASSWORD: docpilot, POSTGRES_DB: docpilot}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U docpilot" --health-interval 5s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 20
    outputs:
      quality: ${{ steps.changes.outputs.quality }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - name: Did quality-relevant code change?
        id: changes
        working-directory: .
        run: |
          if [ "${{ github.event_name }}" = "push" ] && git diff --name-only HEAD~1 HEAD | grep -qE \
            '^backend/(app/llm/|app/agent/|app/tools/|app/services/(retrieval|chat|ocr|parsing)\.py|evals/)'; then
            echo "quality=true" >> "$GITHUB_OUTPUT"
          else
            echo "quality=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements*.txt}
      - name: Tesseract (OCR)
        run: sudo apt-get update -q && sudo apt-get install -y -q tesseract-ocr tesseract-ocr-eng
      - run: pip install -r requirements-dev.txt
      - name: Lint and types
        run: ruff check . && ruff format --check . && mypy app
      - name: Tests (fake AI provider)
        run: pytest -q
      - name: Offline evals
        run: python evals/run_all.py --mode offline --out evals/results/offline.json
      - name: Offline eval gate
        run: python evals/gate.py evals/results/offline.json evals/baselines/offline.json --summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json}
      - name: UI build
        working-directory: frontend
        run: npm ci --no-audit --no-fund && npm run build

  real-eval:
    needs: checks
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && needs.checks.outputs.quality == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      db:
        image: pgvector/pgvector:0.8.7-pg16
        env: {POSTGRES_USER: docpilot, POSTGRES_PASSWORD: docpilot, POSTGRES_DB: docpilot}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U docpilot" --health-interval 5s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements*.txt}
      - name: Tesseract (OCR)
        run: sudo apt-get update -q && sudo apt-get install -y -q tesseract-ocr tesseract-ocr-eng
      - run: pip install -r requirements-dev.txt
      - name: Real-model evals
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python evals/run_all.py --mode real --out evals/results/real.json
      - name: Real eval gate
        run: |
          if [ -f evals/baselines/real.json ]; then
            python evals/gate.py evals/results/real.json evals/baselines/real.json --summary "$GITHUB_STEP_SUMMARY"
          else
            echo "### No real baseline yet: this run's results are the candidate baseline (see the artifact)." >> "$GITHUB_STEP_SUMMARY"
            python -c "import json; print(json.dumps(json.load(open('evals/results/real.json'))['summary'], indent=2))" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-eval-results
          path: backend/evals/results/real.json
          if-no-files-found: ignore
